trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm run lint --if-present
    displayName: Lint

  - script: npm test --if-present
    displayName: Test

  - script: npm audit --audit-level=high
    displayName: Dependency security audit
